<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. 앱 배경 (경찰 네이비) -->
  <rect width="512" height="512" rx="112" fill="#0b2a4a"/>

  <!-- 2. 시험지 바탕 -->
  <rect x="120" y="120" width="272" height="340" rx="16" fill="#ffffff" />

  <!-- 3. 클립보드 상단 (골드) -->
  <rect x="192" y="88" width="128" height="48" rx="16" fill="#c9a227" />
  <rect x="224" y="72" width="64" height="24" rx="12" fill="#e2e8f0" />

  <!-- 4. 문서 내용 (문제 가로줄) -->
  <!-- 문제 1 -->
  <rect x="152" y="176" width="24" height="24" rx="6" fill="#f1f5f9"/>
  <line x1="192" y1="188" x2="352" y2="188" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <line x1="152" y1="220" x2="280" y2="220" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  
  <!-- 문제 2 -->
  <rect x="152" y="268" width="24" height="24" rx="6" fill="#f1f5f9"/>
  <line x1="192" y1="280" x2="320" y2="280" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <line x1="152" y1="312" x2="300" y2="312" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>

  <!-- 문제 3 -->
  <rect x="152" y="360" width="24" height="24" rx="6" fill="#f1f5f9"/>
  <line x1="192" y1="372" x2="340" y2="372" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>

  <!-- 5. 채점 마크 (한국식 큰 빨간 동그라미 O) -->
  <circle cx="180" cy="192" r="36" fill="none" stroke="#e63946" stroke-width="10" opacity="0.85"/>
  <circle cx="180" cy="284" r="36" fill="none" stroke="#e63946" stroke-width="10" opacity="0.85"/>

  <!-- 6. 100점 만점 도장 -->
  <g transform="translate(320, 380) rotate(-15)">
    <!-- 원형 테두리 -->
    <circle cx="4" cy="0" r="48" fill="none" stroke="#e63946" stroke-width="8" opacity="0.9"/>
    <!-- 숫자 1 -->
    <path d="M -24 -16 L -16 -24 L -16 24" fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- 숫자 0 -->
    <ellipse cx="6" cy="0" rx="10" ry="24" fill="none" stroke="#e63946" stroke-width="8" opacity="0.9"/>
    <!-- 숫자 0 -->
    <ellipse cx="34" cy="0" rx="10" ry="24" fill="none" stroke="#e63946" stroke-width="8" opacity="0.9"/>
  </g>
</svg>
