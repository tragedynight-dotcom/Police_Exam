<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실무역량평가DaMoa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#0b2a4a">
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body>
  <!-- 아래 src 주소를 실제 스트림릿 앱 주소로 변경하세요. 끝에 ?embed=true를 붙이면 스트림릿 기본 메뉴바가 숨겨집니다. -->
  <iframe src="https://police-exam.streamlit.app/?embed=true" allow="clipboard-write; camera; geolocation; fullscreen"></iframe>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('ServiceWorker 등록 성공');
        });
      });
    }
  </script>
</body>
</html>
